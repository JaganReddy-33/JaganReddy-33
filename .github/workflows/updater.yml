name: Permanent Profile Metrics Updater

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every night at midnight
  workflow_dispatch: # Allows you to run it manually with 1 click
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-profile-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      # 1. Generate Static Stats Card
      - name: Generate General Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=JaganReddy-33&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: profile-assets/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # 2. Generate Static Languages Card
      - name: Generate Top Languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=JaganReddy-33&layout=compact&theme=tokyonight&hide_border=true
          path: profile-assets/langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # 3. Generate Static Snake Game Animation
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: JaganReddy-33
          outputs: |
            profile-assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 4. Commit and Push everything directly to your repository
      - name: Commit and Push Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/*.svg
          git commit -m "Automated update of static profile assets [skip ci]" || exit 0
          git push
