<svg xmlns="http://www.w3.org/2000/svg" width="560" height="284" viewBox="0 0 560 284" role="img" aria-label="Seatline overview"><rect x=".5" y=".5" width="559" height="283" rx="8" fill="#0E0E11" stroke="#2A2620"/><rect x="36" y="0" width="64" height="2" fill="#D4AF37"/><text x="36" y="46" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17.5" fill="#8C857A">A booking system built around one question: what</text><text x="36" y="73" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17.5" fill="#8C857A">happens when <tspan fill="#F3D98B">50 people click Book</tspan> on the last</text><text x="36" y="100" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17.5" fill="#8C857A">seat at the same instant?</text><rect x="36" y="129" width="488" height="1" fill="#2A2620"/><path d="M42 158l4.5 4.5-4.5 4.5-4.5-4.5z" fill="#D4AF37"/><text x="60" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#F5EFE0" fill-opacity=".92">One atomic findOneAndUpdate, not check-then-write</text><path d="M42 189l4.5 4.5-4.5 4.5-4.5-4.5z" fill="#D4AF37"/><text x="60" y="194" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#F5EFE0" fill-opacity=".92">Idempotency keys stop double-booking on retries</text><path d="M42 220l4.5 4.5-4.5 4.5-4.5-4.5z" fill="#D4AF37"/><text x="60" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#F5EFE0" fill-opacity=".92">Live seat sync across tabs with Socket.IO</text><path d="M42 251l4.5 4.5-4.5 4.5-4.5-4.5z" fill="#D4AF37"/><text x="60" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#F5EFE0" fill-opacity=".92">Load test: 20 concurrent requests, exactly 1 booking</text></svg>