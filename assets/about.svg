  <tspan x="36" y="62">A 2026 <tspan fill="#F3D98B" font-style="italic">Electronics &amp; Communication</tspan></tspan>
  <tspan x="36" y="94"><tspan fill="#F3D98B" font-style="italic">Engineering</tspan> graduate who started on the JAVA/MERN </tspan>
  <tspan x="36" y="126">stack and is now going deeper into the engineering</tspan>
  <tspan x="36" y="158">beneath modern applications.</tspan>
</text>

<text font-family="Georgia, 'Times New Roman', serif" font-size="17.5" fill="#8C857A">
  <tspan x="36" y="204">I care about more than an app that looks like it works.</tspan>
  <tspan x="36" y="230">I want to know how requests move, how data changes, how</tspan>
  <tspan x="36" y="256">transactions behave, and what happens when concurrent traffic</tspan>
  <tspan x="36" y="282">hits the same row.</tspan>
</text>

