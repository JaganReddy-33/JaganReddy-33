<text x="56" y="330" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#F5EFE0" fill-opacity=".78" opacity="1">I build systems, not tutorial clones.<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.30;.36;.96;1" dur="9s" repeatCount="indefinite"/></text>
<text x="56" y="330" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#F5EFE0" fill-opacity=".78" opacity="0">Reliable under load. Honest under failure.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.30;.36;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
<text x="56" y="330" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#F5EFE0" fill-opacity=".78" opacity="0">Turning requirements into reliable software.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.30;.36;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>

<circle cx="64" cy="376" r="4" fill="#7BD88F"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="64" cy="376" r="4" fill="none" stroke="#7BD88F"><animate attributeName="r" values="4;12" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle>
<text x="84" y="380" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#F5EFE0" fill-opacity=".85">OPEN TO WORK  ·  ENTRY-LEVEL FULL STACK &amp; JAVA BACKEND</text>

