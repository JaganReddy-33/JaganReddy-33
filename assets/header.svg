  </linearGradient>
  <linearGradient id="goldM" gradientUnits="userSpaceOnUse" x1="-40" y1="-30" x2="40" y2="30">
    <stop offset="0" stop-color="#F3D98B"/><stop offset="1" stop-color="#A67C1F"/>
  </linearGradient>
  <radialGradient id="glowA" cx="1000" cy="60" r="560" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#D4AF37" stop-opacity=".26"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
  </radialGradient>
