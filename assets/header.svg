<text x="1144" y="64" text-anchor="end" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#8C857A">BENGALURU, IN — 12.97°N 77.59°E</text>

<text x="56" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="#F5EFE0">Jaganmohan <tspan font-style="italic" fill="url(#gold)">Reddy</tspan></text>
<text x="58" y="250" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace" font-size="15" letter-spacing="5" fill="#F5EFE0" fill-opacity=".88">FULL STACK DEVELOPER   /   JAVA BACKEND ENGINEER</text>
